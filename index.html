<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HillRush 3D - Computer Graphics Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Prevent default scrolling and gesture behaviors on touch screens */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      background-color: #0b0c10;
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body>
  <!-- Three.js Canvas Container -->
  <div id="canvas-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></div>

  <!-- HUD Overlay -->
  <div id="hud-container" class="hud-overlay" style="z-index: 10;">
    <header class="hud-header">
      <h1 class="hud-title">HillRush 3D</h1>
      <div class="hud-controls">
        <button id="theme-toggle" class="btn btn-icon" title="Toggle Theme" aria-label="Toggle Theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button id="restart-btn" class="btn btn-primary" title="Restart Game">Restart</button>
      </div>
    </header>

    <div class="hud-stats">
      <div class="hud-stat-box score-box">
        <span class="stat-label">SCORE</span>
        <span id="score-value" class="stat-value">0</span>
      </div>
      <div class="hud-stat-box progress-box">
        <div class="progress-info">
          <span class="stat-label">PROGRESS</span>
          <span id="progress-percent" class="stat-value">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Start Screen Modal -->
  <div id="start-modal" class="modal-overlay" style="z-index: 20;">
    <div class="modal-content glass-card animate-pop-in">
      <h2 class="modal-title">HillRush 3D</h2>
      <p class="modal-subtitle">Grafika Komputer Final Project</p>
      
      <div class="instructions-card">
        <h3>Controls</h3>
        <div class="control-row">
          <span class="key-cap">D</span> or <span class="key-cap">➔</span>
          <span class="control-desc">Accelerate / Move Forward</span>
        </div>
        <div class="control-row">
          <span class="key-cap">A</span> or <span class="key-cap">➔</span>
          <span class="control-desc">Reverse / Move Backward</span>
        </div>
        <div class="control-row">
          <span class="mouse-icon">🖱️</span>
          <span class="control-desc">Hover over coins to highlight them</span>
        </div>
      </div>
      
      <button id="start-btn" class="btn btn-action">Start Game</button>
    </div>
  </div>

  <!-- Victory Modal -->
  <div id="victory-modal" class="modal-overlay hidden" style="z-index: 20;">
    <div class="modal-content glass-card">
      <div class="victory-trophy">🏆</div>
      <h2 class="modal-title">Victory!</h2>
      <p class="modal-subtitle">You reached the finish line!</p>
      
      <div class="score-summary">
        <span class="summary-label">Final Score</span>
        <span id="victory-score" class="summary-value">0</span>
      </div>

      <button id="victory-restart-btn" class="btn btn-action">Play Again</button>
    </div>
  </div>

  <!-- Main Game Entry Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
